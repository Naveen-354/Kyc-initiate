<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Status & Initiate</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f5f5f5; }
        .container { background-color: #fff; padding: 2rem; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="email"], select {
            width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
        .prefix-col { flex: 0 0 100px !important; }
        button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        button:hover { background-color: #0056b3; }
        .hidden { display: none; }
        #responseArea { margin-top: 1rem; padding: 1rem; background-color: #e9ecef; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
        .loader { text-align: center; font-style: italic; color: #666; margin-top: 1rem; }
        .link-area { margin-top: 1rem; padding: 1rem; background-color: #d4edda; border: 1px solid #c3e6cb; border-radius: 4px; color: #155724; text-align: center; font-size: 1.1rem;}
        .link-area a { font-weight: bold; color: #0056b3; text-decoration: none; }
        .link-area a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>KYC Process</h2>
    
    <div id="formArea">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" maxlength="50" placeholder="John Doe" required>
        </div>
        <div class="form-group">
            <label for="panNo">PAN Number *</label>
            <input type="text" id="panNo" placeholder="ABCDE1234F" required maxlength="10">
        </div>
        <div class="form-group">
            <label for="emailId">Email ID *</label>
            <input type="email" id="emailId" maxlength="50" placeholder="user@example.com" required>
        </div>
        
        <div class="form-group flex-row">
            <div class="prefix-col">
                <label for="mobilePrefix">Code *</label>
                <input type="text" id="mobilePrefix" value="+91" required maxlength="5">
            </div>
            <div>
                <label for="mobileNo">Mobile Number *</label>
                <input type="text" id="mobileNo" maxlength="10" placeholder="9876543210" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="dob">Date of Birth (dd/MM/yyyy) *</label>
            <input type="text" id="dob" placeholder="15/08/1990" required>
        </div>
        
        <button id="processBtn">Check Status & Initiate</button>
    </div>

    <div id="loading" class="hidden loader">Processing...</div>
    <div id="linkArea" class="hidden link-area"></div>
    <div id="responseArea" class="hidden"></div>
</div>

<script>
    const baseUrl = 'https://api.midfin360.com/api/v1/mfu-box';

    document.getElementById('processBtn').addEventListener('click', async () => {
        const name = document.getElementById('name').value.trim();
        const panNo = document.getElementById('panNo').value.trim();
        const emailId = document.getElementById('emailId').value.trim();
        const mobilePrefix = document.getElementById('mobilePrefix').value.trim();
        const mobileNo = document.getElementById('mobileNo').value.trim();
        const dob = document.getElementById('dob').value.trim();

        if (!name || !panNo || !emailId || !mobilePrefix || !mobileNo || !dob) {
            alert('Please fill out all mandatory fields.');
            return;
        }

        if (!/^[A-Za-z]{5}[0-9]{4}[A-Za-z]{1}$/.test(panNo)) {
            alert('Please enter a valid 10-character PAN number.');
            return;
        }

        showLoading(true);
        hideResponse();

        try {
            // Step 1: Check Status
            const statusResponse = await fetch(`${baseUrl}/kra/kyc-status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ panNo: panNo })
            });
            const statusData = await statusResponse.json();
            
            if (!statusResponse.ok || !statusData.data) {
                showResponse(statusData);
                showLoading(false);
                return;
            }

            const kycStatusDetails = statusData.data;
            const initiateType = (kycStatusDetails.KYCInitiateType || "").toLowerCase();
            const initiateTypeDetail = (kycStatusDetails.KYCInitiateTypeDetail || "").toLowerCase();

            // Check if New or ReKYC
            const isNewOrReKyc = initiateType.includes("new") || initiateType.includes("rekyc") || 
                                 initiateTypeDetail.includes("new") || initiateTypeDetail.includes("rekyc");

            if (isNewOrReKyc) {
                // Step 2: Initiate KYC
                const initiatePayload = {
                    "PanNo": panNo,
                    "PanValidationFlag": "N", // Default validation
                    "Name": name,
                    "MobileNumberPrefix": mobilePrefix,
                    "MobileNo": mobileNo,
                    "Emailid": emailId,
                    "DateOfBirth": dob,
                    "VerifyKYCStatusWithKRA": "Y",
                    "IsIndividual": "Y"
                };

                // Add KRA status codes if present in status response
                if(kycStatusDetails.KYCStatus) {
                    initiatePayload.KRAStatusCode = kycStatusDetails.KYCStatus;
                }

                const initResponse = await fetch(`${baseUrl}/kyc/initiate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(initiatePayload)
                });
                
                const initData = await initResponse.json();
                
                if (initData.data && (initData.data.KYCOnboardingURL || initData.data.redirectUrl)) {
                    window.location.href = initData.data.KYCOnboardingURL || initData.data.redirectUrl;
                } else {
                    showResponse(initData); // If no redirect URL, just show response
                }
            } else {
                // Step 3: Just show status response if not New or ReKYC
                showResponse(statusData);
            }

        } catch (error) {
            showResponse({ error: error.message });
        } finally {
            showLoading(false);
        }
    });

    function showLoading(show) {
        document.getElementById('loading').classList.toggle('hidden', !show);
    }

    function showResponse(data) {
        const resArea = document.getElementById('responseArea');
        resArea.classList.remove('hidden');
        resArea.textContent = JSON.stringify(data, null, 2);
    }

    function hideResponse() {
        document.getElementById('responseArea').classList.add('hidden');
        document.getElementById('responseArea').textContent = '';
        document.getElementById('linkArea').classList.add('hidden');
        document.getElementById('linkArea').innerHTML = '';
    }

    function showLink(url, text) {
        const linkArea = document.getElementById('linkArea');
        linkArea.classList.remove('hidden');
        linkArea.innerHTML = `<a href="${url}" target="_blank">${text}</a>`;
    }
</script>
</body>
</html>
